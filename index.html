<html>
    <script src='https://d3js.org/d3.v5.min.js'></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
    <body>
    <p style="padding-left: 120px; font-size: 24px; font-weight: bold;">
        chart of the game industry by genre sales from 1980-2016
    </p>
    <svg id="chart" width="1000" height="475"></svg>
    <button id="scene1">1</button>
    <button id="scene2">2</button>
    <button id="scene3">3</button>
    <select id="yearSelect"></select>
    <script>
        //code setup found via https://stackoverflow.com/questions/49599691/how-to-load-data-from-a-csv-file-in-d3-v5
        d3.csv('year_genre_region.csv')
        .then(function(data) {
            genres = [...new Set(data.map(function(d){return d.genre;}))]
            years = [...new Set(data.map(function(d){return d.release_year;}))]
            console.log(genres)
            console.log(years)
            //convert year and sales to numbers
            data.forEach(function(d){
                d.release_year = +d.release_year;
                d.sales = +d.sales;
            });

            scene = 1;

            actionSales = data.filter(function(d){return d.genre === "Action";});
            FightingSales = data.filter(function(d){return d.genre === "Fighting";});
            MiscSales = data.filter(function(d){return d.genre === "Misc";});
            ShooterSales = data.filter(function(d){return d.genre === "Shooter";});
            SportsSales = data.filter(function(d){return d.genre === "Sports";});
            PlatformSales = data.filter(function(d){return d.genre === "Platform";});
            PuzzleSales = data.filter(function(d){return d.genre === "Puzzle";});
            RacingSales = data.filter(function(d){return d.genre === "Racing";});
            SimulationSales = data.filter(function(d){return d.genre === "Simulation";});
            AdventureSales = data.filter(function(d){return d.genre === "Adventure";});
            RolePlayingSales = data.filter(function(d){return d.genre === "Role-Playing";});
            StrategySales = data.filter(function(d){return d.genre === "Strategy";});
            
            genreData = new Map();
            genreData.set("Action", actionSales);
            genreData.set("Fighting", FightingSales);
            genreData.set("Misc", MiscSales);
            genreData.set("Shooter", ShooterSales);
            genreData.set("Sports", SportsSales);
            genreData.set("Platform", PlatformSales);
            genreData.set("Puzzle", PuzzleSales);
            genreData.set("Racing", RacingSales);
            genreData.set("Simulation", SimulationSales);
            genreData.set("Adventure", AdventureSales);
            genreData.set("Role-Playing", RolePlayingSales);
            genreData.set("Strategy", StrategySales);
            console.log(genreData)


            function LineChart(){
                LineColors = ["red","blue","green","orange","purple","brown","pink",
                "gray","cyan","magenta","gold","black"];
                width = 800;
                height = 450;

                margin = {
                    top: 40,
                    right: 40,
                    bottom: 60,
                    left: 70
                };
                x = d3.scaleLinear()
                    .domain([1980, 2016])
                    .range([margin.left, width - margin.right]);

                color = d3.scaleOrdinal()
                    .domain(genres)
                    .range(LineColors);

                y = d3.scaleLinear()
                    .domain([0, 150])
                    .range([height - margin.bottom, margin.top]);
                    d3.select("svg")
                        .append("g")
                        .attr("transform", "translate(0,"+(height - margin.bottom)+")")
                        .call(d3.axisBottom(x));

                    d3.select("svg")
                        .append("g")
                        .attr("transform", "translate("+margin.left+",0)")
                        .call(d3.axisLeft(y));
                    line = d3.line()
                        .x(function(d){
                            return x(d.release_year);
                        })
                        .y(function(d){
                            return y(d.sales);
                        });

                        genreData.forEach(function(values, genre){
                            d3.select("svg")
                                .append("path")
                                .attr("class", "G_Line")
                                .attr("genre", genre)
                                .attr("fill", "none")
                                .attr("stroke", color(genre))
                                .attr("stroke-width", 2)
                                .attr("d", line(values));     
                            console.log(actionSales);
                        })
                        Colorlegend = d3.select("#chart")
                                .append("g")
                                .attr("transform", "translate("+width+",30)");

                        genres.forEach(function(genre, i){

                            Colorlegend.append("rect")
                                .attr("x", 0)
                                .attr("y", i * 22)
                                .attr("width", 25)
                                .attr("height", 10)
                                .attr("fill", color(genre));

                            Colorlegend.append("text")
                                .attr("x", 30)
                                .attr("y", i * 22 + 10)
                                .text(genre);
                            });
                //revamped based on example from https://codeactually.com/d3.html
                        select = d3.select("#yearSelect");
                        select.selectAll("option")
                                .data(years)
                                .enter()
                                .append("option")
                                .text(function(d){return d;})
                                .attr("value", function(d){return d;});
            }
            function SceneChanger(){
                d3.select("#chart").html("");
                if (scene === 1){
                    LineChart();
                    Scene1();
                }
                else if (scene === 2){
                    LineChart();
                    Scene2();
                }
                else if (scene === 3){
                    LineChart();
                    Scene3();
                }
            }
            SceneChanger();
            //following d3 documentation https://d3js.org/d3-selection/events
            d3.select("#scene1")
                .on("click", function(){
                    scene = 1;
                    SceneChanger();
                });

            d3.select("#scene2")
                .on("click", function(){
                    scene = 2;
                    SceneChanger();
                });

            d3.select("#scene3")
                .on("click", function(){
                    scene = 3;
                    SceneChanger();
                });
            //functions for anotations and exploration
            function tooltipAnotate(){
                if(selectedGenre === null){return;}       
                //use year from option value selected
                //reference https://d3-wiki.readthedocs.io/zh-cn/master/Selections/#property
                 year = +d3.select("#yearSelect").property("value");
                //get the sales values based on genre
                 values = genreData.get(selectedGenre);
                //remove old annotations
                d3.select(".FreeRoam").remove();
                // find sales matching year selected
                 yearData = values.find(function(d){
                    return d.release_year === year;
                });
                if(yearData === null){ //if no data dont try and display
                    return;
                }
                //annotate to display result
                dx = 80;
                dy = -80;

                if (2005> year && year >= 1993) {
                    dx = -120;
                    dy = -80;
                }
                else if (2005 <= year){
                    dx = -120;
                    dy = -2;
                }
                
                annotation = [
                    {
                        note:{
                            title: selectedGenre + " Sales",
                            label:
                                "Year: " + year +" Sales: " + yearData.sales + " million"
                        },
                        x:x(year),
                        y:y(yearData.sales),
                        dx:dx,
                        dy:dy
                    }
                ];

                makeAnnotations = d3.annotation()
                    .annotations(annotation);
                d3.select("#chart")
                    .append("g")
                    .attr("class","FreeRoam")
                    .call(makeAnnotations)
                    
            }
            function Scene1(){
               
                annotations = [
                    {
                            type: d3.annotationCalloutCircle,
                            note: {
                                label: "1984-1989 puzzle,platform,and shooter game sales spike",
                                title: "beginning signs of game industry"
                            },
                            x: x(1986.5),
                            y: y(35),
                            dx: 20,
                            dy: -80,
                            subject: {
                                radius: 57
                            }
                        },
                    {
                        type: d3.annotationCalloutCircle,
                            note: {
                                label: "1995-2000 games of all genres gain popularity:",
                                title: "growth of game industry:"
                            },
                            x: x(1998),
                            y: y(35),
                            dx: 10,
                            dy: -160,
                            subject: {
                                radius: 50
                            }
                    }
                ];

                makeAnnotations = d3.annotation()
                    .annotations(annotations);

                d3.select("#chart")
                    .append("g")
                    .call(makeAnnotations)

            }
            function Scene2(){
                annotations = [
                    {
                            type: d3.annotationCalloutCircle,
                            note: {
                                label: "2005-2010 action and sports game explode in sales with new technology along with growth of other genres",
                                title: "Golden era of video games:"
                            },
                            x: x(2007),
                            y: y(120),
                            dx: -120,
                            dy: 10,
                            subject: {
                                radius: 60
                            }
                        },
                    {
                        type: d3.annotationCalloutCircle,
                            note: {
                                label: "By 2016 game sales decline to 1997 levels with little variety",
                                title: "decline of game industry:"
                            },
                            x: x(2016),
                            y: y(30),
                            dx: 40,
                            dy: 10,
                            subject: {
                                radius: 40
                            }
                    }
                ];

                makeAnnotations = d3.annotation()
                    .annotations(annotations);

                d3.select("#chart")
                    .append("g")
                    .call(makeAnnotations)
            }
            function Scene3(){
                //annotation for explaining how to explore
                HowTooGuide = [
                    {
                        note: {
                            title: "How to explore:",
                            label: "Click on a genre line to highlight it, then change the year dropdown to display sales for that genre at that year."
                        },
                        x: 800,
                        y: 300,
                        dx: 0,
                        dy: 0
                    }
                ];
                //make howtoguide display
                makeGuide = d3.annotation()
                    .annotations(HowTooGuide);
                
                d3.select("#chart")
                    .append("g")
                    .attr("class", "annotation")
                    .call(makeGuide)

                d3.selectAll(".G_Line")
                    .on("click", function(){
                        //save the clicked genre
                        selectedGenre = d3.select(this).attr("genre");
                        //make other lines transparent for viewing
                        d3.selectAll(".G_Line")
                            .style("opacity", 0.2)
                            .attr("stroke-width", 2.5);
                        //make clicked line thicker for visual clarity
                        d3.select(this)
                            .style("opacity", 1)
                            .attr("stroke-width", 3);
                        tooltipAnotate();
                    });
                    //dropdown for sales annotation
                    d3.select("#yearSelect")
                        .on("change", function(){

                            tooltipAnotate();
                        });
            }
        })
        
        .catch(function(error){ 
            console.error(error);
        })
    </script>
    </body>
</html>
